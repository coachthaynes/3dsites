<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are On The List, Clay County Basketball Academy</title>
<meta name="description" content="Thank you for signing up for Clay County Basketball Academy season updates.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0c;--panel:#111815;--line:rgba(255,255,255,0.12);
    --white:#FFFFFF;--dim:rgba(255,255,255,0.7);--mint:#6EE7C0;--mint-deep:#3FBE96;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--white);font-family:'Poppins',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:40px 20px;-webkit-font-smoothing:antialiased;
  }
  .box{max-width:520px;}
  .box img{width:64px;height:64px;margin:0 auto 22px;display:block;}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(28px,5vw,40px);margin:0 0 16px;}
  p{color:var(--dim);font-size:16px;line-height:1.7;margin:0 0 28px;}
  a.btn{
    display:inline-block;padding:13px 26px;font-weight:700;font-size:13.5px;
    border-radius:999px;background:var(--mint);color:#06231a;
  }
  a.btn:hover{background:var(--mint-deep);}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/img/logo.png" alt="Clay County Basketball Academy logo">
    <h1>You Are On The List</h1>
    <p>Thanks for signing up. Coach Tenise will personally reach out once the next Clay County Basketball Academy season is confirmed. Talk soon.</p>
    <a class="btn" href="/">Back To The Homepage</a>
  </div>
</body>
</html>
