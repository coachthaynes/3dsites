<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form Registry</title></head>
<body>
<!--
  Netlify's form detection only scans static HTML in the published build.
  The Essential, Elite, and Illumination player pages (and the player's own
  self-service edit page) are all rendered dynamically (by a Netlify
  Function, or from a template only ever read at request time), so Netlify
  never sees their forms at build time unless a copy also exists in a real
  static file. This page exists only for that scan, it is never meant to be
  visited. Field names below must exactly match the real forms in
  netlify/functions/_lib/render-essential-v2.js, render-elite.js, and
  render-illumination.js (via illumination-index-template.html), and
  netlify/functions/player-edit.js.
-->
<div style="display:none">

  <form name="weekly-stats" method="POST" data-netlify="true" netlify-honeypot="website">
    <input name="website">
    <input name="slug">
    <input name="playerName">
    <input name="playerEmail">
    <textarea name="stats"></textarea>
    <textarea name="specialMentions"></textarea>
    <input name="photoNote">
  </form>

  <form name="elite-contact-request" method="POST" data-netlify="true" netlify-honeypot="website">
    <input name="website">
    <input name="subject">
    <input name="name">
    <input name="organization">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <textarea name="reason"></textarea>
  </form>

  <form name="essential-contact-request" method="POST" data-netlify="true" netlify-honeypot="website">
    <input name="website">
    <input name="subject">
    <input name="name">
    <input name="organization">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <textarea name="reason"></textarea>
  </form>

  <form name="contact-request" method="POST" data-netlify="true" netlify-honeypot="website">
    <input name="website">
    <input name="subject">
    <input name="name">
    <input name="organization">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <select name="role"><option>College coach or recruiter</option></select>
    <select name="requested"><option>Head coach</option></select>
    <textarea name="reason"></textarea>
  </form>

  <form name="nil-inquiry" method="POST" data-netlify="true" netlify-honeypot="company-url">
    <input name="company-url">
    <input name="name">
    <input name="business">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <select name="type"><option>Social content</option></select>
    <select name="budget"><option>Product or trade</option></select>
    <textarea name="message"></textarea>
  </form>

</div>
</body>
</html>
