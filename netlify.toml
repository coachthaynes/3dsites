[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://aiyanahaynes.elevateherhoopsreport.com/media/*"
  to = "/media/players/aiyana-haynes/:splat"
  status = 200
  force = true

# Aiyana was converted from a hand built static page to a dynamic player
# record (see data/conversions/aiyana-haynes.json), so her old subdomain now
# points at the same live, up to date page as her new bare root URL below,
# instead of the now retired static file.
[[redirects]]
  from = "https://aiyanahaynes.elevateherhoopsreport.com/*"
  to = "/.netlify/functions/illumination?slug=aiyana-haynes"
  status = 200
  force = true

[[redirects]]
  from = "https://kennedyjeffress.elevateherhoopsreport.com/media/*"
